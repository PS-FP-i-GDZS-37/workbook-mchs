// ===== ДАННЫЕ: ТЕОРИЯ =====
var THEORY=[
{title:"Физическая культура в подготовке обучающихся МЧС России",items:[
{h:"1. Понятие физической культуры и её функции",t:"Физическая культура — часть общечеловеческой культуры, сфера социальной деятельности, направленная на сохранение и укрепление здоровья, развитие физических способностей человека. Функции: образовательная, воспитательная, оздоровительная, прикладная, рекреативная, соревновательная."},
{h:"2. Физическая культура как научная дисциплина",t:"Изучает закономерности физического развития и совершенствования человека, механизмы управления двигательными действиями, физиологические и психологические основы физической активности. Интегрирует данные анатомии, физиологии, биомеханики, психологии, педагогики."},
{h:"3. Основные понятия системы физической культуры",t:"Физическое развитие — процесс изменения форм и функций организма. Физическое воспитание — педагогический процесс физического совершенствования. Физическая подготовка — развитие физических качеств и формирование двигательных навыков. Физическое упражнение — двигательное действие для физического совершенствования."},
{h:"4. Физическая культура как учебная дисциплина в МЧС России",t:"Обязательная учебная дисциплина базовой части учебного плана. Обеспечивает формирование профессионально-прикладной физической подготовленности курсантов. Занятия проводятся на всех курсах (1–5), включают теоретический и практический разделы."},
{h:"5. Цель, задачи и средства дисциплины",t:"Цель — формирование физической культуры личности и профессионально-прикладной физической подготовленности. Задачи: развитие физических качеств, формирование прикладных навыков, укрепление здоровья, воспитание морально-волевых качеств. Средства: физические упражнения, естественные силы природы, гигиенические факторы."},
{h:"6. Ценностные ориентации курсантов",t:"Понимание физической культуры как средства профессионального становления; осознание необходимости физического совершенствования для служебной деятельности; стремление к достижению высоких результатов; понимание связи между физическим состоянием и надёжностью в экстремальных ситуациях."},
{h:"7. Функции физической культуры в системе МЧС",t:"Профессионально-прикладная (формирование качеств для спасательных и пожарных работ); здоровьесберегающая; социально-коммуникативная (командное взаимодействие); воспитательная (дисциплина, ответственность); культурно-ценностная (приобщение к ценностям физической культуры)."}
]},
{title:"Самостоятельные занятия физическими упражнениями",items:[
{h:"1. Сущность самостоятельных занятий",t:"Органическая часть процесса физического воспитания, дополняющая учебные занятия. Направлены на закрепление и совершенствование двигательных навыков, повышение физической подготовленности, поддержание здоровья."},
{h:"2. Основные понятия",t:"Самостоятельные занятия — физические упражнения во внеучебное время. Самоконтроль — наблюдение за состоянием организма. Дозировка — величина нагрузки (продолжительность, интенсивность, повторения). Интенсивность — сила воздействия нагрузки."},
{h:"3. Мотивация и целенаправленность",t:"Мотивация формируется на основе осознания необходимости физического совершенствования. Целенаправленность: подготовка к нормативам, развитие качеств, восстановление, коррекция телосложения. Эффективность зависит от устойчивой внутренней мотивации."},
{h:"4. Формы и средства",t:"Формы: утренняя гимнастика, самостоятельные тренировки, спортивные секции, соревнования. Средства: общеразвивающие упражнения, упражнения на развитие качеств, прикладные упражнения, спортивные игры."},
{h:"5. Выбор систем упражнений",t:"Зависит от уровня подготовленности, возраста, здоровья, профессиональных задач. Для курсантов МЧС: атлетическая гимнастика, кроссовая подготовка, спортивные игры, прикладные упражнения."},
{h:"6. Планирование занятий",t:"Определение целей, выбор средств, составление недельного и месячного планов, распределение нагрузок, контроль состояния. Учёт расписания, режима дня, периода восстановления. Чередование нагрузок разной направленности."},
{h:"7. Сенситивные периоды",t:"Быстрота — 16–18 лет, сила — 17–20 лет, скоростная выносливость — 16–18 лет, аэробная выносливость — 17–20 лет, гибкость — до 18 лет. Учёт сенситивных периодов оптимизирует подготовку."},
{h:"8. Управление занятиями",t:"Планирование, организация, контроль и коррекция. Контроль по субъективным (самочувствие, сон, аппетит) и объективным (ЧСС, масса, результаты) показателям. Коррекция — изменение нагрузки, состава упражнений."},
{h:"9. Границы интенсивности",t:"По ЧСС: низкая — 100–120, средняя — 120–140, большая — 140–160, высокая — 160–180, максимальная — >180. Оздоровительная зона: 120–150. Для выносливости: 140–170. Превышение ведёт к переутомлению."},
{h:"10. Самоконтроль",t:"Систематическое наблюдение за организмом. Объективные: ЧСС, АД, масса, ЖЕЛ. Субъективные: самочувствие, сон, аппетит, желание тренироваться. Дневник самоконтроля отслеживает динамику."},
{h:"11. Профилактика травматизма",t:"Правильная разминка (10–15 мин), соблюдение техники, постепенное увеличение нагрузок, исправный инвентарь, учёт здоровья и погоды, отказ при плохом самочувствии. При болях — прекратить занятие."}
]},
{title:"Основы физиологии тренировки",items:[
{h:"1. Энергетическое обеспечение",t:"Три системы: анаэробная алактатная (АТФ-КФ) — 5–10 сек; анаэробная лактатная (гликолиз) — 30 сек–2 мин; аэробная — >2 мин. Преобладание зависит от длительности и интенсивности."},
{h:"2. Суперкомпенсация",t:"После нагрузки ресурсы истощаются, затем восстанавливаются и превышают исходный уровень. В фазе суперкомпенсации следующая тренировка даёт максимальный эффект. Слишком частые — перетренированность; слишком редкие — потеря эффекта."},
{h:"3. Пульсовые зоны",t:"Восстановление (50–60% ЧСС макс), аэробная (60–70%), темповая (70–80%), анаэробная (80–90%), максимальная (90–100%). Каждая зона решает свои задачи."},
{h:"4. Утомление и восстановление",t:"Утомление — временное снижение работоспособности. Восстановление: питание, сон (7–9 ч), активный отдых, водные процедуры, массаж. Полное восстановление — 24–48 ч."},
{h:"5. Адаптация",t:"Срочная — немедленная реакция (пульс, потоотделение). Долговременная — структурные изменения (гипертрофия мышц, увеличение объёма сердца, капилляризация). Регулярные нагрузки — основа адаптации."},
{h:"6. Развитие силы",t:"Сила — способность преодолевать сопротивление. Зависит от гипертрофии, нервной координации, биомеханики. Методы: максимальных усилий, повторных усилий, изометрический, динамических усилий."},
{h:"7. Развитие выносливости",t:"Общая (аэробная) — МПК, ударный объём сердца, капилляризация. Специальная — устойчивость к утомлению в конкретной деятельности. Методы: равномерный, переменный, интервальный, повторный."},
{h:"8. Развитие быстроты",t:"Быстрота — выполнение движений за минимальное время. Формы: время реакции, скорость одиночного движения, частота движений. Методы: повторный с максимальной интенсивностью, реагирование, игровой."},
{h:"9. Гибкость и ловкость",t:"Гибкость — амплитуда движений, зависит от эластичности мышц и связок. Методы: статические и динамические растяжки. Ловкость — перестройка двигательной деятельности. Развивается через игры, акробатику."},
{h:"10. Перетренированность",t:"Симптомы: хроническая усталость, повышение утреннего пульса, ухудшение сна, снижение результатов, потеря мотивации. Профилактика: рациональное планирование, чередование, отдых, питание, контроль."}
]},
{title:"Основы здорового образа жизни",items:[
{h:"1. ЗОЖ: понятие и компоненты",t:"Система привычек для сохранения и укрепления здоровья. Компоненты: рациональное питание, двигательная активность, сон, закаливание, отказ от вредных привычек, гигиена, психоэмоциональная устойчивость, режим труда и отдыха."},
{h:"2. Режим дня курсанта",t:"Распределение времени на основные виды деятельности: подъём, гимнастика, гигиена, завтрак, занятия, обед, самоподготовка, спорт, ужин, отбой. Соблюдение режима повышает работоспособность."},
{h:"3. Рациональное питание",t:"Сбалансированность (белки, жиры, углеводы, витамины), регулярность (3–5 раз), умеренность, разнообразие. Для курсантов: белок 1.5–2 г/кг, углеводы 5–7 г/кг, жидкость 2–3 л/день."},
{h:"4. Значение сна",t:"Восстановление организма, 7–9 часов. Фазы: медленный (восстановление тела) и быстрый (нервной системы). Недостаток сна снижает иммунитет, координацию, повышает риск травм."},
{h:"5. Закаливание",t:"Повышение устойчивости к неблагоприятным факторам. Методы: воздушные и солнечные ванны, водные процедуры. Правила: постепенность, регулярность, систематичность. Для МЧС — профессиональная необходимость."},
{h:"6. Вредные привычки",t:"Курение: сужение сосудов, снижение МПК, уменьшение силы. Алкоголь: разрушение клеток, снижение координации, нарушение восстановления. В МЧС — абсолютное недопущение."},
{h:"7. Гигиена тела и одежды",t:"Ежедневный душ, чистая одежда, уход за кожей, волосами, зубами. Спортивная одежда — натуральные ткани, соответствующая размеру. Обувь — амортизирующая подошва, фиксация стопы."},
{h:"8. Психоэмоциональное здоровье",t:"Стабильное эмоциональное состояние — основа работоспособности. Регуляция: аутотренинг, дыхательные упражнения, активность, общение. Для МЧС — управление стрессом в экстремальных условиях."},
{h:"9. Двигательная активность",t:"Оптимальный объём — 8–12 часов в неделю. Гиподинамия ведёт к ослаблению мышц, нарушению обмена веществ, снижению иммунитета. Для курсантов — занятия плюс самостоятельные тренировки."},
{h:"10. Профилактика заболеваний",t:"Медосмотры, вакцинация, закаливание, питание, активность, гигиена. В казарме — санитарные нормы, проветривание, уборка. При симптомах — обращение к врачу."}
]},
{title:"Профессионально-прикладная физическая подготовка",items:[
{h:"1. Сущность ППФП в МЧС",t:"Специализированное направление физического воспитания для профессиональной деятельности спасателя и пожарного. Включает развитие выносливости, силы, ловкости, быстроты, навыки работы с оборудованием."},
{h:"2. Профессиограмма специалиста МЧС",t:"Переносить длительные нагрузки; работа в СИЗ; переноска грузов и пострадавших; работа на высоте и в замкнутых пространствах; действия при ограниченной видимости и высоких температурах; быстрые решения в стрессе."},
{h:"3. Прикладные упражнения",t:"Подъём по лестнице-штурмовке; преодоление препятствий; переноска пострадавших; работа с рукавами и стволами; спасательные работы на воде; работа в СИЗОД. Моделируют реальные задачи."},
{h:"4. Профессиональная выносливость",t:"Способность длительно выполнять служебные обязанности в неблагоприятных условиях. Кроссы, марш-броски, упражнения в СИЗ, длительные тренировки с отягощениями. Критерий — 30–60 мин интенсивной деятельности."},
{h:"5. Силовая подготовка спасателя",t:"Преодоление сопротивления, подъём и переноска тяжёлых предметов. Упражнения: подтягивание, отжимания, рывок гири, переноска партнёра. Важна силовая выносливость — длительное проявление силы."},
{h:"6. Подъём по ЛШ на учебную башню",t:"Ключевое упражнение пожарных-спасателей. Навыки: навеска лестницы, хват, постановка ног, ритм, безопасность. Нормативы: 2-й этаж — 10/12/14 сек, 3-й — 18/21/24, 4-й — 24/26/28."},
{h:"7. Работа в СИЗОД",t:"Повышенная нагрузка: доп. масса 10–15 кг, сопротивление дыханию, ограничение обзора, теплоизоляция. Тренировка: упражнения на выносливость в СИЗОД, контроль расхода воздуха, действия в задымлении."},
{h:"8. Психологическая подготовка",t:"Готовность к экстремальным ситуациям. Компоненты: эмоциональная устойчивость, быстрые решения, стрессоустойчивость, командная работа. Методы: моделирование, соревновательный, усложнённые условия."},
{h:"9. Спасательные работы на воде",t:"Уверенное плавание, ныряние, буксировка пострадавшего, приёмы освобождения от захватов, первая помощь. Плавание 200–500 м, ныряние 3–5 м, буксировка манекена."},
{h:"10. Профессиональные соревнования",t:"Пожарно-прикладной и спасательный спорт. Виды: подъём по ЛШ, полоса препятствий, боевое развёртывание, спасательная эстафета. Стимулируют рост мастерства и подготовленности."}
]},
{title:"Охрана труда и безопасность",items:[
{h:"Лёгкая атлетика",t:"Разминка, соответствующая обувь, бежать по своей дорожке, не останавливаться резко после финиша. При прыжках — правильное приземление. При метаниях — запрет нахождения в зоне броска."},
{h:"Прикладная гимнастика",t:"Проверка снарядов, наличие матов, страховка, правильная техника, разминка, постепенное усложнение, запрет выполнения без разрешения преподавателя."},
{h:"Лыжная подготовка",t:"Исправность инвентаря, одежда по погоде, разминка, дистанция (3–5 м на равнине, 30 м на спусках), спуск в подготовленных местах."},
{h:"Приёмы самообороны",t:"Разминка, отработка в парах по заданию, защитная экипировка, страховка партнёра, запрет болевых приёмов без контроля, сигнал «стоп» при боли."},
{h:"Спортивные игры",t:"Разминка, ровная сухая площадка, соответствующая обувь, соблюдение правил, запрет грубых действий, судейство преподавателя."},
{h:"Подъём по ЛШ",t:"Проверка исправности лестницы, правильная навеска, страховка снизу, защитная обувь и рукавицы, маты у основания, запрет нахождения в зоне падения."},
{h:"Методика самоконтроля",t:"Дневник самоконтроля, регулярное измерение ЧСС, контроль массы, субъективных показателей. Периодически — ортостатическая проба. При отклонениях — коррекция нагрузки."},
{h:"Первая помощь при травмах",t:"Ушибы — холод, покой, давящая повязка. Растяжения — иммобилизация, холод. Переломы — обездвижить, не вправлять, скорая. Вывихи — зафиксировать, холод. Кровотечение — давящая повязка или жгут. Обморок — горизонтальное положение, свежий воздух. Сердечно-лёгочная реанимация при отсутствии дыхания."}
]}
];

function genComplexes(){
var c=[];
var types=["Общая физическая подготовка","Силовая подготовка","Скоростная подготовка","Выносливость","Прикладная подготовка","Лыжная подготовка","Гимнастика","Круговая тренировка","Спортивные игры","Контрольная тренировка"];
for(var course=1;course<=5;course++){
for(var w=0;w<10;w++){
var exs=[
{name:"Разминка",dosage:"10-12 мин",method:"Бег, ОРУ, суставная гимнастика"},
{name:types[w].includes("Сил")?"Подтягивание":"Отжимания",dosage:(3+course)+"×"+(8+course*2),method:types[w].includes("Сил")?"На высокой перекладине":"В упоре лежа"},
{name:"Приседания",dosage:(3+course)+"×"+(15+course*3),method:"С весом тела"+(course>2?" или гантель":"")},
{name:"Пресс",dosage:(3+course)+"×"+(20+course*5),method:"Подъем туловища из положения лежа"},
{name:types[w].includes("Вынос")||types[w].includes("Круг")?"Бег 1000 м":"Прыжки",dosage:types[w].includes("Вынос")?(course+1)+"×1000 м":(3+course)+"×15",method:types[w].includes("Вынос")?"Средний темп":"В длину с места, многоскоки"}
];
c.push({course:course,week:w+1,title:"Курс "+course+" — Комплекс №"+(w+1)+": "+types[w],exercises:exs});
}
}
return c;
}

// Загрузка из localStorage
function loadState(){
try{
var s=localStorage.getItem('ert_mchs_state');
if(s){
var parsed=JSON.parse(s);
state.profile=parsed.profile||{};
state.diary=parsed.diary||[];
state.ortho=parsed.ortho||[];
state.results=parsed.results||[];
state.customTheory=parsed.customTheory||[];
state.customPractice=parsed.customPractice||[];
state.customTests=parsed.customTests||[];
state.uploadedFiles=parsed.uploadedFiles||{};
}
}catch(e){}
// Инициализация профиля
if(!state.profile.name)state.profile={name:'',gender:'male',course:1,platoon:'',age:18,height:170,weight:65,restPulse:60};
}
function saveState(){
var toSave={profile:state.profile,diary:state.diary,ortho:state.ortho,results:state.results,customTheory:state.customTheory,customPractice:state.customPractice,customTests:state.customTests,uploadedFiles:state.uploadedFiles};
localStorage.setItem('ert_mchs_state',JSON.stringify(toSave));
}

function renderNav(){
var html='';
TABS.forEach(function(t){

});
document.getElementById('nav').innerHTML=html;
}

state.currentTab=id;
renderNav();
renderContent();
}

function toggleMode(){
state.mode=state.mode==='student'?'teacher':'student';
var sw=document.getElementById('modeSwitch');
if(state.mode==='teacher'){sw.classList.add('on');}
else{sw.classList.remove('on');}
renderContent();
}

function renderContent(){
var c=document.getElementById('content');
switch(state.currentTab){
case 'profile':c.innerHTML=renderProfile();afterProfile();break;
case 'theory':c.innerHTML=renderTheory();break;
case 'practice':c.innerHTML=renderPractice();break;
case 'diary':c.innerHTML=renderDiary();break;
case 'ortho':c.innerHTML=renderOrtho();break;
case 'charts':c.innerHTML=renderCharts();afterCharts();break;
case 'norms':c.innerHTML=renderNorms();break;
case 'submit':c.innerHTML=renderSubmit();afterSubmit();break;
case 'tests':c.innerHTML=renderTests();break;
case 'analytics':c.innerHTML=renderAnalytics();break;
case 'history':c.innerHTML=renderHistory();afterHistory();break;
}
}

function renderProfile(){
var p=state.profile;
var bmi=p.height&&p.weight?(p.weight/((p.height/100)*(p.height/100))).toFixed(1):'—';
var bmiCat='';
if(bmi!=='—'){
bmif=parseFloat(bmi);
if(bmif<18.5)bmiCat='Недостаток массы';
else if(bmif<25)bmiCat='Норма';
else if(bmif<30)bmiCat='Избыток массы';
else bmiCat='Ожирение';
}
var ageGroup='';
if(p.age){
if(p.age<=25)ageGroup='1-я группа (до 25 лет)';
else if(p.age<=30)ageGroup='2-я группа (26–30 лет)';
else if(p.age<=35)ageGroup='3-я группа (31–35 лет)';
else ageGroup='4-я группа (старше 35 лет)';
}
var zones='';
if(p.restPulse&&p.age){
var max=220-p.age;
var ranges=[
{z:'Зона восстановления (50-60%)',lo:Math.round((max-p.restPulse)*0.5+p.restPulse),hi:Math.round((max-p.restPulse)*0.6+p.restPulse),cls:'z1'},
{z:'Аэробная зона (60-70%)',lo:Math.round((max-p.restPulse)*0.6+p.restPulse),hi:Math.round((max-p.restPulse)*0.7+p.restPulse),cls:'z2'},
{z:'Темповая зона (70-80%)',lo:Math.round((max-p.restPulse)*0.7+p.restPulse),hi:Math.round((max-p.restPulse)*0.8+p.restPulse),cls:'z3'},
{z:'Анаэробная зона (80-90%)',lo:Math.round((max-p.restPulse)*0.8+p.restPulse),hi:Math.round((max-p.restPulse)*0.9+p.restPulse),cls:'z4'},
{z:'Максимальная зона (90-100%)',lo:Math.round((max-p.restPulse)*0.9+p.restPulse),hi:max,cls:'z5'}
];
ranges.forEach(function(r){
zones+='<div class="pulse-zone '+r.cls+'"><span>'+r.z+'</span><span>'+r.lo+'–'+r.hi+' уд/мин</span></div>';
});
}

function toggleAccordion(id){
var el=document.getElementById('acc_'+id);
el.classList.toggle('open');
}
function addTheory(){
var title=document.getElementById('th_title').value.trim();
var h=document.getElementById('th_h').value.trim();
var t=document.getElementById('th_t').value.trim();
if(!title||!h||!t)return;
var found=state.customTheory.find(function(s){return s.title===title;});
if(found){found.items.push({h:h,t:t});}
else{state.customTheory.push({title:title,items:[{h:h,t:t}]});}
saveState();
renderContent();
}
function uploadFile(category){
var input=document.getElementById(category+'_file')||document.getElementById('th_file');
var file=input.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
if(!state.uploadedFiles[category])state.uploadedFiles[category]=[];
state.uploadedFiles[category].push({name:file.name,data:e.target.result});
saveState();
renderContent();
};
reader.readAsDataURL(file);
}
function renderUploadedFiles(category){
var files=state.uploadedFiles[category]||[];
if(!files.length)return '';
var html='<label>Загруженные файлы:</label>';
files.forEach(function(f,i){
html+='<div class="result-row"><a href="'+f.data+'" download="'+f.name+'" style="color:#1565c0;text-decoration:none">'+f.name+'</a><button class="del-btn" onclick="deleteFile(\''+category+'\','+i+')">Удалить</button></div>';
});
return html;
}
function deleteFile(category,index){
state.uploadedFiles[category].splice(index,1);
saveState();
renderContent();
}

function switchPracticeTab(course){
document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
event.target.classList.add('active');
renderPracticeList(course);
}
function renderPracticeList(course){
var allPractice=PRACTICAL.concat(state.customPractice);
var list=allPractice.filter(function(p){return p.course===course;});
var html='';
list.forEach(function(p){
html+='<div class="accordion"><div class="accordion-header" onclick="this.nextElementSibling.classList.toggle(\'open\')">'+p.title+'</div>';
html+='<div class="accordion-body"><table><tr><th>Упражнение</th><th>Дозировка</th><th>Методические указания</th></tr>';
p.exercises.forEach(function(ex){
html+='<tr><td><b>'+ex.name+'</b></td><td>'+ex.dosage+'</td><td>'+ex.method+'</td></tr>';
});
html+='</table></div></div>';
});
var el=document.getElementById('practice_list');
if(el)el.innerHTML=html;
}
function addPractice(){
var course=parseInt(document.getElementById('pr_course').value);
var title=document.getElementById('pr_title').value.trim();
var exsText=document.getElementById('pr_exs').value.trim();
if(!title||!exsText)return;
var lines=exsText.split('\n');
var exercises=lines.map(function(l){
var parts=l.split('|');
return{name:parts[0]?parts[0].trim():'',dosage:parts[1]?parts[1].trim():'',method:parts[2]?parts[2].trim():''};
}).filter(function(e){return e.name;});
state.customPractice.push({course:course,week:0,title:title,exercises:exercises});
saveState();
renderContent();
}

function showNormInfo(){
var p=state.profile;
var sel=document.getElementById('s_exercise');
if(!sel)return;
var idx=parseInt(sel.value);
var n=NORMS[idx];
var genderKey=p.gender==='male'?'boys':'girls';
var v=n[genderKey]&&n[genderKey][p.course];
var el=document.getElementById('s_info');
if(v&&el){
el.innerHTML='<div class="info-box"><b>Нормативы для '+p.course+' курса:</b> Отлично — '+v.ex+', Хорошо — '+v.good+', Удовлетворительно — '+v.sat+' '+n.unit+'</div>';
}
}
function submitNorm(){
var p=state.profile;
var idx=parseInt(document.getElementById('s_exercise').value);
var n=NORMS[idx];
var genderKey=p.gender==='male'?'boys':'girls';
var v=n[genderKey]&&n[genderKey][p.course];
if(!v)return;
var raw=document.getElementById('s_result').value.trim();
if(!raw)return;
var result=parseFloat(raw.replace(',', '.'));
var grade='',cls='';
if(n.lowerBetter){
if(result<=v.ex){grade='Отлично';cls='badge-excellent';}
else if(result<=v.good){grade='Хорошо';cls='badge-good';}
else if(result<=v.sat){grade='Удовлетворительно';cls='badge-satisfactory';}
else{grade='Неудовлетворительно';cls='badge-fail';}
}else{
if(result>=v.ex){grade='Отлично';cls='badge-excellent';}
else if(result>=v.good){grade='Хорошо';cls='badge-good';}
else if(result>=v.sat){grade='Удовлетворительно';cls='badge-satisfactory';}
else{grade='Неудовлетворительно';cls='badge-fail';}
}
state.results.push({date:new Date().toISOString().slice(0,10),exercise:n.name,result:raw,unit:n.unit,grade:grade,cls:cls,normIdx:idx});
saveState();
renderContent();
}
function delResult(i){
state.results.splice(i,1);
saveState();
renderContent();
}

// ===== ТЕСТЫ =====
function renderTests(){
var allTests=TESTS.concat(state.customTests);
var html='<div class="card"><h2>Тестирование</h2>';
if(state.mode==='teacher'){
html+='<div class="teacher-panel"><h3>Создать вопрос</h3>';
html+='<label>Вопрос</label><input id="t_q" placeholder="Текст вопроса">';
html+='<label>Варианты (по одному в строке, правильный — первый)</label>';
html+='<textarea id="t_a" rows="4" placeholder="Вариант 1 (правильный)&#10;Вариант 2&#10;Вариант 3&#10;Вариант 4"></textarea>';
html+='<button class="btn btn-sm" onclick="addTest()">Добавить вопрос</button>';
html+='<hr style="margin:10px 0"><label>Загрузить файл</label><input type="file" id="tests_file" accept=".pdf,.docx"><button class="btn btn-sm" onclick="uploadFile(\'tests\')">Загрузить</button>';
html+=renderUploadedFiles('tests');
html+='</div>';
}
html+='<div id="test_area"></div>';
html+='</div>';
return html;
}
function startTest(){
var allTests=TESTS.concat(state.customTests);
state.testAnswers=new Array(allTests.length).fill(-1);
renderTestQuestions();
}
function renderTestQuestions(){
var allTests=TESTS.concat(state.customTests);
var html='<button class="btn btn-green btn-sm" onclick="finishTest()">Завершить и проверить</button>';
allTests.forEach(function(t,i){
html+='<div class="test-q"><h4>'+(i+1)+'. '+t.q+'</h4>';
t.a.forEach(function(opt,j){
var cls='';
if(state.testAnswers[i]===j)cls='selected';
html+='<div class="test-opt '+cls+'" onclick="selectAnswer('+i+','+j+')">'+opt+'</div>';
});
html+='</div>';
});
html+='<button class="btn btn-green" onclick="finishTest()">Завершить и проверить</button>';
document.getElementById('test_area').innerHTML=html;
}
function selectAnswer(qIdx,optIdx){
state.testAnswers[qIdx]=optIdx;
renderTestQuestions();
}
function finishTest(){
var allTests=TESTS.concat(state.customTests);
var correct=0;
var html='<div class="card"><h2>Результаты теста</h2>';
allTests.forEach(function(t,i){
var userAns=state.testAnswers[i];
var isCorrect=userAns===t.correct;
if(isCorrect)correct++;
var cls=isCorrect?'correct':'wrong';
var ansText=userAns>=0?t.a[userAns]:'— не отвечено —';
html+='<div class="test-q"><h4>'+(i+1)+'. '+t.q+'</h4>';
t.a.forEach(function(opt,j){
var c='';
if(j===t.correct)c='correct';
else if(j===userAns&&j!==t.correct)c='wrong';
html+='<div class="test-opt '+c+'">'+opt+'</div>';
});
html+='<div style="margin:6px 0;font-size:13px">Ваш ответ: <b>'+ansText+'</b> '+(isCorrect?'✓':'✗ Правильный: '+t.a[t.correct])+'</div>';
html+='</div>';
});
var pct=Math.round(correct/allTests.length*100);
var grade=pct>=90?'Отлично':pct>=75?'Хорошо':pct>=50?'Удовлетворительно':'Неудовлетворительно';
html+='<div class="stat-box" style="margin:10px 0"><h3>'+correct+' / '+allTests.length+'</h3><p>'+pct+'% — '+grade+'</p></div>';
html+='<button class="btn" onclick="startTest()">Пройти заново</button></div>';
document.getElementById('test_area').innerHTML=html;
}
function addTest(){
var q=document.getElementById('t_q').value.trim();
var a=document.getElementById('t_a').value.trim();
if(!q||!a)return;
var opts=a.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
if(opts.length<2)return;
state.customTests.push({q:q,a:opts,correct:0});
saveState();
renderContent();
}

// ===== АНАЛИТИКА =====
function renderAnalytics(){
var html='<div class="card"><h2>Аналитика</h2>';
if(!state.results.length){
html+='<div class="info-box">Нет данных. Сдайте нормативы для отображения аналитики.</div>';
html+='</div>';
return html;
}
var grades={excellent:0,good:0,satisfactory:0,fail:0};
state.results.forEach(function(r){
if(r.cls==='badge-excellent')grades.excellent++;
else if(r.cls==='badge-good')grades.good++;
else if(r.cls==='badge-satisfactory')grades.satisfactory++;
else grades.fail++;
});
var total=state.results.length;
html+='<div class="flex-stats">';
html+='<div class="stat-box"><h3>'+total+'</h3><p>Всего сдач</p></div>';
html+='<div class="stat-box"><h3>'+grades.excellent+'</h3><p>Отлично</p></div>';
html+='<div class="stat-box"><h3>'+grades.good+'</h3><p>Хорошо</p></div>';
html+='<div class="stat-box"><h3>'+grades.satisfactory+'</h3><p>Удовлетворительно</p></div>';
html+='<div class="stat-box"><h3>'+grades.fail+'</h3><p>Неудовлетворительно</p></div>';
html+='</div>';
// Отстающие упражнения
var exerciseStats={};
state.results.forEach(function(r){
if(!exerciseStats[r.exercise])exerciseStats[r.exercise]={total:0,fail:0};
exerciseStats[r.exercise].total++;
if(r.cls==='badge-fail')exerciseStats[r.exercise].fail++;
});
html+='<h4 style="margin:14px 0 6px;color:#b71c1c">Упражнения с неудовлетворительными результатами</h4>';
var hasWeak=false;
for(var ex in exerciseStats){
if(exerciseStats[ex].fail>0){
hasWeak=true;
html+='<div class="result-row"><span><b>'+ex+'</b></span><span>Неуд: '+exerciseStats[ex].fail+' из '+exerciseStats[ex].total+'</span></div>';
}
}
if(!hasWeak)html+='<div class="info-box">Нет отстающих упражнений</div>';
// Прогресс по тестам
if(state.testAnswers.length){
var allTests=TESTS.concat(state.customTests);
var correct=0;
state.testAnswers.forEach(function(a,i){
if(i<allTests.length&&a===allTests[i].correct)correct++;
});
html+='<h4 style="margin:14px 0 6px;color:#b71c1c">Последний тест</h4>';
html+='<div class="stat-box"><h3>'+correct+' / '+allTests.length+'</h3><p>'+Math.round(correct/allTests.length*100)+'% правильных ответов</p></div>';
}
html+='</div>';
return html;
}

// ===== ИСТОРИЯ =====
var historyChart=null;
function renderHistory(){
var html='<div class="card"><h2>История результатов</h2>';
if(!state.results.length){
html+='<div class="info-box">Нет данных. Сдайте нормативы для отображения истории.</div>';
return html+'</div>';
}
var exercises={};
state.results.forEach(function(r){
if(!exercises[r.exercise])exercises[r.exercise]=[];
exercises[r.exercise].push(r);
});
html+='<label>Выберите упражнение</label><select id="h_exercise" onchange="updateHistoryChart()">';
for(var ex in exercises){
html+='<option value="'+ex+'">'+ex+' ('+exercises[ex].length+')</option>';
}
html+='</select>';
html+='<div class="chart-container"><canvas id="history_canvas"></canvas></div>';
html+='<table id="history_table"></table>';
html+='</div>';
return html;
}
function afterHistory(){
updateHistoryChart();
}
function updateHistoryChart(){
var sel=document.getElementById('h_exercise');
if(!sel)return;
var exName=sel.value;
var records=state.results.filter(function(r){return r.exercise===exName;});
var labels=records.map(function(r){return r.date;});
var data=records.map(function(r){return parseFloat(r.result.replace(',','.'));});
var colors=records.map(function(r){
if(r.cls==='badge-excellent')return '#2e7d32';
if(r.cls==='badge-good')return '#f57f17';
if(r.cls==='badge-satisfactory')return '#bf360c';
return '#b71c1c';
});
if(historyChart)historyChart.destroy();
var el=document.getElementById('history_canvas');
if(el&&data.length){
historyChart=new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:exName,data:data,backgroundColor:colors}]},options:{responsive:true,maintainAspectRatio:false}});
}
var tableEl=document.getElementById('history_table');
if(tableEl){
var html='<tr><th>Дата</th><th>Результат</th><th>Оценка</th></tr>';
records.forEach(function(r){
html+='<tr><td>'+r.date+'</td><td>'+r.result+' '+r.unit+'</td><td><span class="badge '+r.cls+'">'+r.grade+'</span></td></tr>';
});
tableEl.innerHTML=html;
}
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
loadState();
renderNav();
renderContent();
// Автозапуск тестов при первом открытии вкладки тестов
document.addEventListener('click',function(e){
if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-start-test')){
startTest();
}
});
</script>
